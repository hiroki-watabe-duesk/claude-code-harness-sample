name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude-code-harness-sample-app[bot]
          prompt: |
            このプルリクエスト(#${{ github.event.pull_request.number }})のコードをレビューしてください。

            以下の観点でレビューコメントを残してください:
            - バグや潜在的な不具合
            - セキュリティ上の懸念
            - パフォーマンスの問題
            - コードの可読性・保守性
            - テストの十分性

            レビューコメントは日本語で記述してください。

      - name: Post review result as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const reviewResult = `${{ steps.claude-review.outputs.result }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewResult
            });
